<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Klaus</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <header id="bar"><span id="session-index">1/1</span><strong id="session-title">Conversation 1</strong><span id="connection" class="off" data-state="NOT CONNECTED" aria-label="NOT CONNECTED">&#9679;</span></header>
  <div id="chat">
    <div id="transcript" role="log" aria-live="polite" aria-label="Transcript"></div>
    <div id="echo" class="msg user hidden"><div class="bubble"></div></div>
    <div id="thinking" class="msg bot hidden" role="status"><div class="bubble"></div></div>
  </div>
  <p id="chip" class="hidden" role="status"></p>
  <p id="status" class="hidden" role="status"></p>
  <p id="banner" class="hidden" role="status" aria-live="assertive"></p>
  <div id="upload" class="hidden"><span></span></div>
  <div id="level" class="hidden" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <section id="launch" class="hidden" aria-hidden="true"><strong id="launch-time"></strong><span id="launch-line"></span><span id="launch-hint"></span></section>
  <input id="composer" type="text" autocomplete="off" placeholder="OK: talk &#183; Left: type">
  <footer id="softkeys"><span id="sk-left">Type</span><span id="sk-center">Talk</span><span id="sk-right">Menu</span></footer>
  <section id="overlay" class="hidden"><div id="overlay-title"></div><div id="overlay-list"></div></section>
  <audio id="player" hidden></audio>
  <script src="app.js"></script>
</body>
</html>
